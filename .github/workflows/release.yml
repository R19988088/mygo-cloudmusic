# Builds the green apps users unzip and run, one artifact per platform and
# architecture: macOS on Apple silicon and Intel, Windows on x64 and ARM64. No
# disk images, no signing beyond ad hoc, and the Windows archives leave out the
# installer, so the workflow needs none of the release secrets. Pushing a tag
# also puts the four archives in a release of the tag; a manual run keeps
# them as artifacts of the run.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the release of a tag

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Ad hoc signing (-sign -): Apple silicon runs no unsigned code, and
      # notarization would need the Apple ID the release secrets hold.
      - name: Build the app
        run: go tool mygo build -platform "darwin/${{ matrix.arch }}" -skip-dmg -skip-notarize -sign -
      - name: Zip it
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          ditto -c -k --sequesterRsrc --keepParent "build/darwin-${{ matrix.arch }}/MyGo 云音乐.app" \
            "build/MyGo-CloudMusic-$version-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MyGo-CloudMusic-macos-${{ matrix.arch }}
          path: build/*.zip

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The installer the build makes beside the app's files is no part of
      # the green version, and the archive leaves it out.
      - name: Build the app
        run: go tool mygo build -platform "windows/${{ matrix.arch }}"
      - name: Zip it
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          (cd "build/windows-${{ matrix.arch }}" && zip -qr "../MyGo-CloudMusic-$version-windows-${{ matrix.arch }}-portable.zip" . \
            -x '*-setup-*.exe' -x 'install.ps1')
      - uses: actions/upload-artifact@v4
        with:
          name: MyGo-CloudMusic-windows-${{ matrix.arch }}
          path: build/*.zip

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*.zip
